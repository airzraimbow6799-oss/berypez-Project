name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, tipos, formato, tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Valores de prueba: el build no debe depender de secretos reales.
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      # Catálogo desde el snapshot versionado: el build no necesita red ni Supabase.
      CATALOG_SOURCE: snapshot
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run build

      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  lighthouse:
    name: Lighthouse (informativo)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      # Catálogo desde el snapshot versionado: el build no necesita red ni Supabase.
      CATALOG_SOURCE: snapshot
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npx --yes @lhci/cli@0.14.0 autorun

  e2e:
    name: E2E Playwright (móvil y escritorio)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # playwright.config.ts levanta `next build` + `next start` con el catálogo desde el snapshot.
      - run: npm run e2e

      - name: Guardar reporte de Playwright
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
